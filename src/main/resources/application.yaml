spring:
  application:
    name: nestro-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # Auth Service
            - id: auth-service-route
              uri: lb://nestro-auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api/v1/auth/(?<segment>.*), /api/auth/$\{segment}

            # User Service
            - id: user-service-route
              uri: lb://nestro-user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - StripPrefix=2

server:
  port: 8888

nestro:
  security:
    jwt:
      secret-key: TSpJYObiOXaTNtH7ileJF2wQQdtJa7gDxKac8O85DOw=
      issuer: http://localhost:8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/